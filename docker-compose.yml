services:
  db:
    image: postgres:16-alpine
    container_name: project_bridge_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bridge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridge_pass}
      POSTGRES_DB: ${POSTGRES_DB:-project_bridge_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridge_user} -d ${POSTGRES_DB:-project_bridge_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bridge_net_dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: project_bridge_backend_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bridge_user}:${POSTGRES_PASSWORD:-bridge_pass}@db:5432/${POSTGRES_DB:-project_bridge_dev}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bridge_net_dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: project_bridge_frontend_dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bridge_net_dev

volumes:
  postgres_data_dev:

networks:
  bridge_net_dev:
    driver: bridge