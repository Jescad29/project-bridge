services:
  db:
    image: postgres:16-alpine
    container_name: project_bridge_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bridge_net_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: project_bridge_backend_prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "5000:5000"
    volumes:
      - backend_logs_prod:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bridge_net_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: project_bridge_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bridge_net_prod

volumes:
  postgres_data_prod:
  backend_logs_prod:

networks:
  bridge_net_prod:
    driver: bridge